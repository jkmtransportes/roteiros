<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JKM | Central de Roteiros</title><style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f1f5fa;color:#19324a}.hero{background:linear-gradient(125deg,#10263f,#146198);color:white;padding:32px 20px 65px}.wrap{max-width:990px;margin:auto}.brand{font-size:21px;font-weight:850;letter-spacing:1px}.brand span{color:#8cddff}h1{font-size:clamp(27px,5vw,43px);margin:25px 0 8px}.sub{color:#c8ddeb;line-height:1.5}.panel{background:white;margin:-33px auto 35px;padding:25px;border-radius:20px;box-shadow:0 16px 40px #142d4b19;position:relative}.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}.year{border:2px solid #e0e9f3;background:#f7fafd;border-radius:15px;padding:19px;text-align:left;cursor:pointer;color:#183c5b}.year.active{background:#e9f5ff;border-color:#1380cb}.year b{font-size:26px;display:block}.year small{color:#637e95}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 15px}.toolbar h2{margin:0}input{border:1px solid #cad8e7;border-radius:11px;padding:12px;font-size:15px;min-width:220px}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:13px}.month{border:1px solid #dce7f0;border-radius:14px;padding:17px;display:flex;flex-direction:column;gap:13px}.month b{font-size:17px}.month small{color:#6e8396}.month a{background:#126eb5;color:white;text-decoration:none;text-align:center;padding:11px;border-radius:10px;font-weight:700}.month.featured{border-color:#e8ae40;background:#fffaf0}.badge{font-size:12px;font-weight:bold;color:#97620c}.share{margin-top:24px;background:#13996d;border:0;border-radius:11px;padding:14px 18px;color:white;font-weight:750;cursor:pointer}.hint{color:#667e90;font-size:13px;line-height:1.6;margin-top:17px}footer{text-align:center;color:#789;margin:25px}.notice{background:#fff5d9;color:#81590c;border-radius:9px;padding:11px;margin-top:13px;font-size:13px}@media(max-width:600px){.panel{padding:16px;margin-left:12px;margin-right:12px}.hero{padding:27px 18px 60px}.toolbar input{width:100%}}</style></head><body><header class="hero"><div class="wrap"><div class="brand">JKM <span>TRANSPORTES</span></div><h1>Central de Roteiros</h1><div class="sub">Consulte as programações por ano e mês.<br>Acesso rápido no celular ou computador.</div></div></header><main class="wrap"><div class="panel"><div class="years" id="years"></div><div class="toolbar"><h2 id="heading">Roteiros</h2><input id="search" placeholder="🔎 Buscar mês ou roteiro" aria-label="Pesquisar"></div><div id="months" class="months"></div><button id="share" class="share">↗ Compartilhar central</button><div id="notice"></div><p class="hint">Os roteiros são abertos no Google Planilhas. O acesso depende das permissões de cada documento.</p></div></main><footer>JKM TRANSPORTES · Central de Roteiros</footer><script>
// CONFIGURAÇÃO: substitua o valor abaixo pelo link CSV da aba Roteiros publicada no Google Planilhas.
const CSV_URL = 'https://docs.google.com/spreadsheets/d/1JJpuAC_vc2qI9j5aHjyXBTODzhqayutmkG_5OQ4SQMg/export?format=csv&gid=1824860840';
const INITIAL_DATA = [{"ano": 2024, "mes": "Janeiro", "descricao": "Roteiro Janeiro/2024", "link": "https://docs.google.com/spreadsheets/d/1wB7uopBd_Gd9Ztd_09BUR3jwx6W1DLl2iYhaYiQzVEc/edit?gid=1133297172#gid=1133297172", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Fevereiro", "descricao": "Roteiro Fevereiro/2024", "link": "https://docs.google.com/spreadsheets/d/1opTHTQsc5MdPDIKDJq2Du7lIo1kZRJ6x3CsiikJKFqk/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Março", "descricao": "Roteiro Março/2024", "link": "https://docs.google.com/spreadsheets/d/1_rek7CjPDV_uyYFYfbHqwmp7cSmDHCsiKrXKjFOz6ZI/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Abril", "descricao": "Roteiro Abril/2024", "link": "https://docs.google.com/spreadsheets/d/1u0Pe6dWiuvhrmmUtqq1FsEK_Hye8eGoS-4oY424dlYk/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Maio", "descricao": "Roteiro Maio/2024", "link": "https://docs.google.com/spreadsheets/d/1lf_lk6bT3RAheYgJsOq4kzwDKRZR546wuCe22dXlhmU/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Junho", "descricao": "Roteiro Junho/2024", "link": "https://docs.google.com/spreadsheets/d/1IueUE-2Z7ZunXjJZLNZ5MR34Bst0BqIMThDD4rR2JOQ/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Julho", "descricao": "Roteiro Julho/2024", "link": "https://docs.google.com/spreadsheets/d/15VyNfv2DGYxUThIz00B2X74Ate3uiCRrV1ZgCKzSFtM/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Agosto", "descricao": "Roteiro Agosto/2024", "link": "https://docs.google.com/spreadsheets/d/1yT2NXQk7Tnle6UjucJndzXtiRPsN-MpdPAY2gHOPJx0/edit?gid=1391294106#gid=1391294106", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Setembro", "descricao": "Roteiro Setembro/2024", "link": "https://docs.google.com/spreadsheets/d/1rA4oSSR4H1IvKz3x4rCrRTyGOr6KXHozlMKQ_yTD7FI/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Outubro", "descricao": "Roteiro Outubro/2024", "link": "https://docs.google.com/spreadsheets/d/1yly1s8TgOIr4PVQSnzjq7lyMjz0bfz2ZjGfmT-Y4Hvc/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Novembro", "descricao": "Roteiro Novembro/2024", "link": "https://docs.google.com/spreadsheets/d/1oIk1jNZLHL-O5V3DELdcF8P1sZDh60sMA_1buRVdjg0/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2024, "mes": "Dezembro", "descricao": "Roteiro Dezembro/2024", "link": "https://docs.google.com/spreadsheets/d/1-j8BYIq-MavCGlN4JamvY8wFMpSIUCI8fSYWbqOlEEE/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Janeiro", "descricao": "Roteiro Janeiro/2025", "link": "https://docs.google.com/spreadsheets/d/1c9ESmr7m7Alr3XPvef3PccWGKy2SiqjxIEPlc6wVq8s/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Fevereiro", "descricao": "Roteiro Fevereiro/2025", "link": "https://docs.google.com/spreadsheets/d/1b-H-QC0FCLM4WsQh1A6AAB8c3ZebK94Nc-gnTFT0LIM/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Março", "descricao": "Roteiro Março/2025", "link": "https://docs.google.com/spreadsheets/d/1cjn8y8osQO3t3hGmseUixfrZH4GpWqjkmr_hjOoMq3M/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Abril", "descricao": "Roteiro Abril/2025", "link": "https://docs.google.com/spreadsheets/d/1ZU63N14QhTYPVBRr9mn8WnfYl6yFJ7ipbDhBOw5VF7k/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Maio", "descricao": "Roteiro Maio/2025", "link": "https://docs.google.com/spreadsheets/d/1equcLfsIHlTsg5BXefhAnPCXiFlescyId8eIVuRLfdo/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Junho", "descricao": "Roteiro Junho/2025", "link": "https://docs.google.com/spreadsheets/d/1Jtjt8yizUf-xVaUCoE5WUJfqS8U45Bwk9u3lH4XT-z8/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Julho", "descricao": "Roteiro Julho/2025", "link": "https://docs.google.com/spreadsheets/d/1K9z7Ny9_CC9ZTkUm4CMmLPVbGd09pZ9GKIMKBFGIU0Y/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Agosto", "descricao": "Roteiro Agosto/2025", "link": "https://docs.google.com/spreadsheets/d/1EIv-rJQKvcgr3FoplGeF5umg5vA7udPGGvalHrxyRpg/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Setembro", "descricao": "Roteiro Setembro/2025", "link": "https://docs.google.com/spreadsheets/d/1uKB2VRZaBkHEFcVeNbAXH8y6ZE-CXKZmtgyLABbaIGk/edit?usp=sharing", "status": "Ativo", "destaque": "Não"}, {"ano": 2025, "mes": "Outubro", "descricao": "Roteiro Outubro/2025", "link": "https://docs.google.com/spreadsheets/d/1gcNqMwr6GYXHnsSvBnIjCRG4m2U8mZ8W86CA9NKihJg/edit?usp=sharing", "status": "Ativo", "destaque": "Sim"}];
let records=INITIAL_DATA,selectedYear='',query='';
const order=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function parseCSV(t){let out=[],row=[],cell='',quote=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quote&&t[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);let h=out.shift().map(x=>x.trim().toUpperCase());return out.map(r=>{let o={};h.forEach((k,i)=>o[k]=r[i]||'');return {ano:Number(o.ANO),mes:o['MÊS']||o.MES,descricao:o['DESCRIÇÃO']||o.DESCRICAO,link:o.LINK,status:o.STATUS,destaque:o.DESTAQUE}})}
function active(){return records.filter(r=>String(r.status).trim().toLowerCase()==='ativo'&&/^https:\/\//.test(r.link)&&r.ano&&r.mes)}
function render(){let data=active(),years=[...new Set(data.map(r=>r.ano))].sort((a,b)=>b-a);if(!years.includes(Number(selectedYear)))selectedYear=String(years[0]||'');let y=document.getElementById('years');y.replaceChildren();years.forEach(yr=>{let b=document.createElement('button');b.className='year'+(String(yr)===selectedYear?' active':'');let strong=document.createElement('b');strong.textContent='📁 '+yr;let small=document.createElement('small');small.textContent=data.filter(r=>r.ano===yr).length+' roteiros disponíveis';b.append(strong,small);b.onclick=()=>{selectedYear=String(yr);render()};y.append(b)});document.getElementById('heading').textContent='Roteiros de '+selectedYear;let target=document.getElementById('months');target.replaceChildren();let list=data.filter(r=>String(r.ano)===selectedYear&&(r.mes+' '+r.descricao).toLocaleLowerCase('pt-BR').includes(query)).sort((a,b)=>order.indexOf(a.mes)-order.indexOf(b.mes));for(let r of list){let card=document.createElement('article');card.className='month'+(String(r.destaque).toLowerCase()==='sim'?' featured':'');let top=document.createElement('div');let title=document.createElement('b');title.textContent='📅 '+r.mes;let small=document.createElement('small');small.textContent=r.descricao||r.ano;top.append(title,document.createElement('br'),small);card.append(top);if(String(r.destaque).toLowerCase()==='sim'){let tag=document.createElement('span');tag.className='badge';tag.textContent='★ EM DESTAQUE';card.append(tag)}let a=document.createElement('a');a.href=r.link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Abrir roteiro ↗';card.append(a);target.append(card)}if(!list.length)target.textContent='Nenhum roteiro encontrado.'}
document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLocaleLowerCase('pt-BR');render()};document.getElementById('share').onclick=async()=>{const url=new URL(location.href);if(url.protocol==='file:'||url.hostname.includes('oaiusercontent.com')||url.hostname.includes('sandbox')){alert('A central ainda não está publicada em endereço público. Publique o HTML antes de compartilhar pelo WhatsApp.');return}let msg='🚛 JKM TRANSPORTES\nCentral de Roteiros Operacionais\nAcesse: '+url.href;if(navigator.share){try{await navigator.share({title:'Central de Roteiros JKM',text:msg,url:url.href});return}catch(e){if(e.name==='AbortError')return}}window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener')};
async function load(){if(CSV_URL){try{let resp=await fetch(CSV_URL,{cache:'no-store'});if(!resp.ok)throw Error('Falha na leitura');let parsed=parseCSV(await resp.text());if(!parsed.length)throw Error('Planilha vazia');records=parsed}catch(e){document.getElementById('notice').innerHTML='<div class="notice">Não foi possível atualizar os dados do Google. Exibindo a lista inicial.</div>'}}render()}load();
</script></body></html>
